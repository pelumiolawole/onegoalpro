<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0908">
  <title>Offline | OneGoal Pro</title>
  <style>
    /* Fully self-contained: no external fonts, scripts or images, because this page only shows with no connection. */
    :root {
      --bg: #0A0908;
      --text: #F5F1ED;
      --muted: #7A6E65;
      --amber: #F59E0B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    main { max-width: 360px; }
    .mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 28px;
      border: 1.5px solid var(--amber);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark span {
      width: 10px;
      height: 10px;
      background: var(--amber);
      border-radius: 50%;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 32px;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    button {
      background: var(--amber);
      color: var(--bg);
      border: 0;
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><span></span></div>
    <h1>You're offline</h1>
    <p>Your goal hasn't gone anywhere. Reconnect and you'll pick up exactly where you left off.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Reload automatically as soon as the connection returns.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
